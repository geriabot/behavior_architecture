# Fixed-orchestrator configuration for behavior_architecture
# orchestrator_type: "restaurant" selects the hard-coded restaurant state machine.
# Use orchestrator_type: "llm" (see test_goal.yaml) for LLM-guided execution.
#
# Usage:
#   ros2 launch behavior_architecture mission_executor.launch.py \
#     config_file:=$(ros2 pkg prefix behavior_architecture)/share/behavior_architecture/config/restaurant_config.yaml

# ── Common fields (shared with LLM config) ────────────────────────────────────
node_name: "bt_node"
orchestrator_type: "restaurant"  # fixed orchestrator registered in OrchestratorFactory

package_name: "behavior_architecture"

# Packages that provide the BT node plugins
bt_nodes_packages:
  - "social_bt_nodes"

# BT plugin libraries to load
plugin_libraries:
  - "libsocial_bt_nodes_plugin.so"

# ── Fixed-orchestrator fields (not used in LLM mode) ─────────────────────────
behaviors:
  # Follow behavior - tracks and follows a person
  - name: "follow_behavior"
    behavior_file: "behaviors/reusable/follow_behavior.xml"
    control_period_ms: 50
  
  # Collect order behavior - interacts with customer to take their order
  - name: "collect_order"
    behavior_file: "behaviors/examples/collect_order.xml"
    control_period_ms: 50
