# Fixed-orchestrator configuration for behavior_architecture
# orchestrator_type: "simple" selects the hard-coded 2-state state machine.
# Use orchestrator_type: "llm" (see test_goal.yaml) for LLM-guided execution.
#
# Usage:
#   ros2 launch behavior_architecture mission_executor.launch.py \
#     config_file:=$(ros2 pkg prefix behavior_architecture)/share/behavior_architecture/config/simple_config.yaml

# ── Common fields (shared with LLM config) ────────────────────────────────────
node_name: "bt_node"
orchestrator_type: "simple"  # fixed orchestrator registered in OrchestratorFactory

package_name: "behavior_architecture"

# Packages that provide the BT node plugins
bt_nodes_packages:
  - "social_bt_nodes"

# BT plugin libraries to load
plugin_libraries:
  - "libsocial_bt_nodes_plugin.so"

# ── Fixed-orchestrator fields (not used in LLM mode) ─────────────────────────
behaviors:
  # First state behavior
  - name: "state1_runner"
    behavior_file: "behaviors/examples/state1.xml"
    control_period_ms: 50
  
  # Second state behavior
  - name: "state2_runner"
    behavior_file: "behaviors/examples/state2.xml"
    control_period_ms: 50
